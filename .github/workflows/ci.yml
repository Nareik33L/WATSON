name: CI

on:
  push:
  pull_request:

# macOS jobs (Swift helper, ScreenCaptureKit, Vision OCR, TCC) arrive with M0-B.

jobs:
  check:
    name: ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/watson

      - name: Tests
        run: uv run pytest
