name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# macOS Swift helper CI is .github/workflows/helper.yml and runs only when helper/ changes.

jobs:
  check:
    name: ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/watson

      - name: Tests
        run: uv run pytest

      - name: Fake-runtime bench smoke
        run: >
          uv run watson-bench run
          --profile 8gb
          --runtime fake
          --frames tools/bench/samples/frames
          --out /tmp/watson-bench-ci
          --report /tmp/watson-bench-ci/report.md
