name: Fixture regen

on:
  pull_request:
    paths:
      - "tools/fixture_gen/**"
      - "tests/fixtures/**"
      - ".github/workflows/fixture-regen.yml"
  push:
    paths:
      - "tools/fixture_gen/**"
      - "tests/fixtures/**"
      - ".github/workflows/fixture-regen.yml"

permissions:
  contents: read

# Default (not opt-in) regen for PRs/pushes that touch the generator or goldens.
# Main CI still skips Playwright; this job installs Chromium and diffs sidecars.

jobs:
  regen:
    name: playwright fixture regen
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Regen and diff committed fixture
        run: uv run pytest tests/eval/test_fixture_regen.py --run-fixture-regen
