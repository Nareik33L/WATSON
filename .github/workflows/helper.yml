name: Helper

on:
  push:
    paths:
      - "helper/**"
      - ".github/workflows/helper.yml"
  pull_request:
    paths:
      - "helper/**"
      - ".github/workflows/helper.yml"

permissions:
  contents: read

# macos-15 minutes are costly on a private repo. This workflow starts only
# when helper/ (or this file) changes. SQLCipher wheel smoke is a separate
# lightweight macos-15 job in .github/workflows/db-smoke.yml.
# No ScreenCaptureKit: both build paths, unit tests, and --selftest only.
# GitHub retired macos-14 images (brownout / 2026-11-02 sunset).
# No WATSON Dev certificate — ad-hoc sign.

jobs:
  helper:
    name: swiftc + SwiftPM + tests
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pin Xcode 16.2
        working-directory: helper
        run: |
          # Package.swift is swift-tools-version 6.0 (dev Mac is 6.0.3 / CLT).
          # Prefer Xcode 16.2 (Swift 6.0.3). Do not pick bare Xcode_16.app
          # (Swift 6.0.0): `ls | sort` ranks it after 16.2 and that compiler
          # rejects NSRunningApplication as non-Sendable.
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif ls -d /Applications/Xcode_16.*.app >/dev/null 2>&1; then
            newest="$(ls -d /Applications/Xcode_16.*.app | sort -V | tail -n 1)"
            sudo xcode-select -s "$newest"
          else
            echo "Xcode 16.2+ not found" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          xcode-select -p
          xcodebuild -version
          swift --version
          swiftc --version
          sw_vers

      - name: No network APIs in the helper
        working-directory: helper
        run: |
          if grep -REn --include='*.swift' \
            'import[[:space:]]+Network\b|URLSession|URLRequest|CFNetwork|NWConnection|URLSessionConfiguration' \
            Sources Tests
          then
            echo "network APIs are not allowed in helper/" >&2
            exit 1
          fi

      # Before custom builds / compare so a later check cannot skip XCTest.
      - name: Test (protocol, sidecar, filters, selftest) via SwiftPM
        working-directory: helper
        run: swift test

      - name: CLT SwiftBridging overlay (fake WATSON_CLT_ROOT)
        run: helper/scripts/test-clt-overlay.sh

      - name: Build (swiftc default, no overlay)
        run: |
          set -euo pipefail
          helper/scripts/build.sh --release --no-sign | tee /tmp/watson-swiftc-build.log
          if grep -F 'CLT SwiftBridging overlay applied' /tmp/watson-swiftc-build.log; then
            echo "FAIL: default CI build applied a CLT overlay" >&2
            exit 1
          fi
          echo "ok: default swiftc build passed with no overlay"

      - name: Keep swiftc binary
        run: |
          mkdir -p /tmp/watson-capture-ci
          cp helper/.build/release/watson-capture /tmp/watson-capture-ci/watson-capture-swiftc
          chmod +x /tmp/watson-capture-ci/watson-capture-swiftc

      - name: --selftest (swiftc binary, no ScreenCaptureKit)
        run: /tmp/watson-capture-ci/watson-capture-swiftc --selftest

      - name: cleanup-spool.sh refuses dangerous paths and cleans a fake spool
        run: helper/scripts/test-cleanup-spool.sh

      - name: Negative — verify fails without embedded Info.plist
        run: |
          set -euo pipefail
          rm -rf helper/.build
          set +e
          helper/scripts/build.sh --release --no-sign --no-embed-plist
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "FAIL: build without Info.plist must fail verify-embedded-plist.sh" >&2
            exit 1
          fi
          NOPLIST=""
          for candidate in \
            helper/.build/release/watson-capture \
            helper/.build/arm64-apple-macosx/release/watson-capture
          do
            if [[ -e "$candidate" ]]; then
              NOPLIST="$candidate"
              break
            fi
          done
          if [[ -z "$NOPLIST" ]]; then
            echo "FAIL: expected a binary so verify could reject it (build rc=$rc)" >&2
            exit 1
          fi
          set +e
          helper/scripts/verify-embedded-plist.sh "$NOPLIST"
          vrc=$?
          set -e
          if [[ "$vrc" -eq 0 ]]; then
            echo "FAIL: verify-embedded-plist.sh passed on a binary with no plist" >&2
            exit 1
          fi
          echo "ok: verify rejected binary without Info.plist (build rc=$rc verify rc=$vrc)"

      - name: Build (SwiftPM --spm, no overlay)
        run: |
          set -euo pipefail
          # Fresh .build so SwiftPM does not collide with the swiftc layout.
          rm -rf helper/.build
          helper/scripts/build.sh --spm --release --no-sign | tee /tmp/watson-spm-build.log
          if grep -F 'CLT SwiftBridging overlay applied' /tmp/watson-spm-build.log; then
            echo "FAIL: default --spm CI build applied a CLT overlay" >&2
            exit 1
          fi
          cp helper/.build/release/watson-capture /tmp/watson-capture-ci/watson-capture-spm
          chmod +x /tmp/watson-capture-ci/watson-capture-spm
          echo "ok: default --spm build passed with no overlay"

      - name: Ad-hoc sign both binaries
        run: |
          helper/scripts/sign.sh \
            --bin /tmp/watson-capture-ci/watson-capture-swiftc \
            --identity - \
            --identifier com.watson.capture
          helper/scripts/sign.sh \
            --bin /tmp/watson-capture-ci/watson-capture-spm \
            --identity - \
            --identifier com.watson.capture

      - name: Compare Info.plist section and codesign Identifier
        run: >
          helper/scripts/compare-embedded-identity.sh
          /tmp/watson-capture-ci/watson-capture-swiftc
          /tmp/watson-capture-ci/watson-capture-spm

      # After the no-overlay compare so these do not disturb those binaries.
      # Fake WATSON_CLT_ROOT remaps only /tmp/watson-ci-fake-clt, not the SDK.
      - name: Overlay e2e — swiftc + fake WATSON_CLT_ROOT
        run: helper/scripts/ci-clt-overlay-e2e.sh swiftc

      - name: Overlay e2e — SwiftPM + fake WATSON_CLT_ROOT
        run: helper/scripts/ci-clt-overlay-e2e.sh spm

      # if: so a SwiftPM overlay failure cannot skip the --no-clt-overlay claim.
      - name: Overlay e2e — --no-clt-overlay + fake WATSON_CLT_ROOT
        if: success() || failure()
        run: helper/scripts/ci-clt-overlay-e2e.sh no-overlay

      - name: Overlay e2e — --spm --no-clt-overlay + fake WATSON_CLT_ROOT
        if: success() || failure()
        run: helper/scripts/ci-clt-overlay-e2e.sh no-overlay-spm
