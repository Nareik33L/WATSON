name: Helper

on:
  push:
    paths:
      - "helper/**"
      - ".github/workflows/helper.yml"
  pull_request:
    paths:
      - "helper/**"
      - ".github/workflows/helper.yml"

permissions:
  contents: read

# macos-15 minutes are costly on a private repo. This workflow is the only
# macOS job and it starts only when helper/ (or this file) changes.
# No ScreenCaptureKit: both build paths, unit tests, and --selftest only.
# GitHub retired macos-14 images (brownout / 2026-11-02 sunset).

jobs:
  helper:
    name: swiftc + SwiftPM + tests
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pin Xcode 16.2
        working-directory: helper
        run: |
          # Package.swift is swift-tools-version 6.0 (dev Mac is 6.0.3 / CLT).
          # Prefer Xcode 16.2 (Swift 6.0.3). Do not pick bare Xcode_16.app
          # (Swift 6.0.0): `ls | sort` ranks it after 16.2 and that compiler
          # rejects NSRunningApplication as non-Sendable.
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif ls -d /Applications/Xcode_16.*.app >/dev/null 2>&1; then
            newest="$(ls -d /Applications/Xcode_16.*.app | sort -V | tail -n 1)"
            sudo xcode-select -s "$newest"
          else
            echo "Xcode 16.2+ not found" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          xcode-select -p
          xcodebuild -version
          swift --version
          swiftc --version
          sw_vers

      - name: No network APIs in the helper
        working-directory: helper
        run: |
          if grep -REn --include='*.swift' \
            'import[[:space:]]+Network\b|URLSession|URLRequest|CFNetwork|NWConnection|URLSessionConfiguration' \
            Sources Tests
          then
            echo "network APIs are not allowed in helper/" >&2
            exit 1
          fi

      - name: Build (swiftc default)
        run: helper/scripts/build.sh --release --no-sign

      - name: Keep swiftc binary
        run: |
          mkdir -p /tmp/watson-capture-ci
          cp helper/.build/release/watson-capture /tmp/watson-capture-ci/watson-capture-swiftc
          chmod +x /tmp/watson-capture-ci/watson-capture-swiftc

      - name: --selftest (swiftc binary, no ScreenCaptureKit)
        run: /tmp/watson-capture-ci/watson-capture-swiftc --selftest

      - name: cleanup-spool.sh refuses dangerous paths and cleans a fake spool
        run: helper/scripts/test-cleanup-spool.sh

      - name: Build (SwiftPM --spm)
        run: |
          # Fresh .build so SwiftPM does not collide with the swiftc layout.
          rm -rf helper/.build
          helper/scripts/build.sh --spm --release --no-sign
          cp helper/.build/release/watson-capture /tmp/watson-capture-ci/watson-capture-spm
          chmod +x /tmp/watson-capture-ci/watson-capture-spm

      - name: Compare Info.plist section and identifier
        run: >
          helper/scripts/compare-embedded-identity.sh
          /tmp/watson-capture-ci/watson-capture-swiftc
          /tmp/watson-capture-ci/watson-capture-spm

      - name: Test (protocol, sidecar, filters, selftest) via SwiftPM
        working-directory: helper
        run: swift test
