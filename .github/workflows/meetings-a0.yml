name: Meetings A0

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

# macos-15 minutes count 10× on a private repo. Not on push/pull_request.
# Trigger by hand, on a v* tag, or Sunday 03:00 UTC (skipped if main was
# idle). See docs/ci.md.

jobs:
  gate:
    uses: ./.github/workflows/macos-gate.yml

  render:
    name: render fixtures + tiny smoke
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Sync fixture + bench deps
        run: uv sync --locked --group fixturegen --group bench --extra transcribe

      - name: Render A0 meeting scripts
        run: >
          uv run watson-fixturegen meetings render --all
          --out tests/fixtures/meetings

      - name: Upload rendered fixtures
        uses: actions/upload-artifact@v4
        with:
          name: a0-meeting-fixtures
          path: tests/fixtures/meetings
          if-no-files-found: error

      - name: Fetch faster-whisper tiny
        env:
          WATSON_ALLOW_NETWORK: "1"
        run: >
          uv run watson-bench transcribe
          --profile 8gb
          --engines faster-whisper
          --sizes tiny
          --fetch-only

      - name: Tiny faster-whisper smoke (must not skip)
        run: uv run pytest tests/eval/test_a0_macos_smoke.py -v --tb=short -s
