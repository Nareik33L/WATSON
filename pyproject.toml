[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watson"
version = "0.1.0"
description = "Local-first, offline-capable work memory for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
watson = "watson.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["watson"]
explicit_package_bases = true
warn_unused_ignores = true
