[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watson"
version = "0.1.0"
description = "Local-first, offline-capable work memory for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "keyring>=25.0",
    "pillow>=13.0",
    "pydantic>=2.10",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "sqlcipher3>=0.6.2",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
watson = "watson.cli:main"
watson-bench = "watson_bench.cli:main"
watson-fixturegen = "watson_fixturegen.cli:main"

[project.optional-dependencies]
# Runtime extras are optional so a missing backend is skipped, not a crash.
# ollama uses stdlib HTTP to 127.0.0.1:11434 — no Python extra required.
llamacpp = ["llama-cpp-python>=0.3.2"]
mlx = ["mlx-lm>=0.21.0", "mlx-vlm>=0.1.14", "mlx-embeddings>=0.0.3"]
fetch = ["huggingface-hub>=0.26.0"]
transcribe = ["faster-whisper>=1.1.0"]
mlx-whisper = ["mlx-whisper>=0.4.1"]
pywhispercpp = ["pywhispercpp>=1.3.0"]

[dependency-groups]
bench = [
    "jiwer>=3.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
]
fixturegen = [
    "jinja2>=3.1",
    "pillow>=13.0",
    "playwright==1.55.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
    {include-group = "bench"},
    {include-group = "fixturegen"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools/bench", "tools/fixture_gen", "."]
markers = [
    "fixture_regen: regenerate a fixture with Playwright Chromium and diff sidecars/truth",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "tools/bench", "tools/fixture_gen"]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/watson"]

[tool.hatch.build.targets.wheel.force-include]
"tools/bench/watson_bench" = "watson_bench"
"tools/bench/candidates" = "watson_bench/data/candidates"
"tools/bench/samples" = "watson_bench/data/samples"
"tools/fixture_gen/watson_fixturegen" = "watson_fixturegen"
"schemas/sidecar.schema.json" = "watson/data/sidecar.schema.json"
# fonts/ and scenarios/ live inside watson_fixturegen and ship in the wheel.

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixtures must keep .format / % / concat forms the AST scanner is proving.
"tests/unit/logging_scan_fixtures/**" = ["UP031", "UP032"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src, tools/fixture_gen, tools/bench"
packages = ["watson", "watson_fixturegen", "watson_bench.transcription"]
explicit_package_bases = true
warn_unused_ignores = true
exclude = "(?x)(^src/watson/memory/migrations/env\\.py$)"

[[tool.mypy.overrides]]
module = ["watson", "watson.*"]
strict = true

# mypy 2 treats the "watson.*" glob as matching watson_fixturegen. Keep that
# package on main's non-strict settings (CI type-checks both trees).
[[tool.mypy.overrides]]
module = ["watson_fixturegen", "watson_fixturegen.*"]
strict = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["watson_bench.transcription", "watson_bench.transcription.*"]
strict = false
warn_return_any = false

# Importing adapters.base pulls the rest of the M0-A package; keep A0
# typechecking on transcription without requiring those modules to be clean.
[[tool.mypy.overrides]]
module = [
    "watson_bench.adapters",
    "watson_bench.adapters.fake",
    "watson_bench.adapters.llamacpp",
    "watson_bench.adapters.mlx",
    "watson_bench.adapters.ollama",
    "watson_bench.prompts",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlcipher3", "sqlcipher3.*", "sqlite_vec", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper",
    "faster_whisper.*",
    "huggingface_hub",
    "jiwer",
    "mlx",
    "mlx.*",
    "mlx_whisper",
    "mlx_whisper.*",
    "numpy",
    "pywhispercpp",
    "pywhispercpp.*",
]
ignore_missing_imports = true
