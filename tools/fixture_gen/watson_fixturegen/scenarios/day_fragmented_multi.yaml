# Fragmented multi-project day — Cedar Works switches across three jobs.
# Frequent context switches, short interruptions, lunch gap, mid-day idle,
# and a private/excluded vault window that must not be stored.
# Fictional people, firms, and hosts only (*.example). Plan §11.1.

